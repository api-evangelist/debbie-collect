openapi: 3.2.0
info:
  title: Debbie Client Payments API
  description: The Debbie Client API is intended for creditors integrating directly with Debbie. It allows clients to create and update collection cases, exchange payment data, and receive case status updates.
  version: '1.0'
  contact:
    name: Debbie API Support
    email: api-support@debbie.dk
servers:
- url: https://creditor.debbie.dk/api
  description: Production
security:
- bearerAuth: []
tags:
- name: Payments
paths:
  /cases/{caseId}/payments:
    post:
      summary: Submit payment information
      operationId: submitPayment
      tags:
      - Payments
      parameters:
      - in: path
        name: caseId
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Payment recorded.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
