openapi: 3.2.0
info:
  title: Debbie Platform Updates API
  description: The Debbie Platform API is a RESTful interface for debt-collection operations on the Debbie SaaS platform. It exposes resources for creditors, cases, customers (debtors), payments and payouts, vouchers, files, updates, and webhook subscriptions.
  version: '1.0'
  contact:
    name: Debbie API Support
    email: api-support@debbie.dk
servers:
- url: https://api.debbie.dk
  description: Production
security:
- bearerAuth: []
tags:
- name: Updates
paths:
  /updates:
    post:
      summary: Create an update
      operationId: createUpdate
      tags:
      - Updates
      responses:
        '201':
          description: Update created.
  /updates/{updateId}:
    patch:
      summary: Update an update
      operationId: patchUpdate
      tags:
      - Updates
      parameters:
      - in: path
        name: updateId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Updated update.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
