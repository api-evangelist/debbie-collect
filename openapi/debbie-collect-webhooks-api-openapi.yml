openapi: 3.2.0
info:
  title: Debbie Platform Webhooks API
  description: The Debbie Platform API is a RESTful interface for debt-collection operations on the Debbie SaaS platform. It exposes resources for creditors, cases, customers (debtors), payments and payouts, vouchers, files, updates, and webhook subscriptions.
  version: '1.0'
  contact:
    name: Debbie API Support
    email: api-support@debbie.dk
servers:
- url: https://api.debbie.dk
  description: Production
security:
- bearerAuth: []
tags:
- name: Webhooks
paths:
  /webhooks/items:
    get:
      summary: List webhook items
      operationId: listWebhookItems
      tags:
      - Webhooks
      responses:
        '200':
          description: Webhook delivery items.
  /webhooks/items/{itemId}:
    patch:
      summary: Patch a webhook item
      operationId: patchWebhookItem
      tags:
      - Webhooks
      parameters:
      - in: path
        name: itemId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Updated webhook item.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
