openapi: 3.2.0
info:
  title: Debbie Platform Customers API
  description: The Debbie Platform API is a RESTful interface for debt-collection operations on the Debbie SaaS platform. It exposes resources for creditors, cases, customers (debtors), payments and payouts, vouchers, files, updates, and webhook subscriptions.
  version: '1.0'
  contact:
    name: Debbie API Support
    email: api-support@debbie.dk
servers:
- url: https://api.debbie.dk
  description: Production
security:
- bearerAuth: []
tags:
- name: Customers
paths:
  /customers:
    post:
      summary: Create a customer (debtor)
      operationId: createCustomer
      tags:
      - Customers
      responses:
        '201':
          description: Customer created.
  /customers/{customerId}:
    get:
      summary: Get a customer
      operationId: getCustomer
      tags:
      - Customers
      parameters:
      - in: path
        name: customerId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A customer resource.
    patch:
      summary: Update a customer
      operationId: patchCustomer
      tags:
      - Customers
      parameters:
      - in: path
        name: customerId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Updated customer.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
