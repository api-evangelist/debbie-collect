openapi: 3.2.0
info:
  title: Debbie Platform Creditors API
  description: The Debbie Platform API is a RESTful interface for debt-collection operations on the Debbie SaaS platform. It exposes resources for creditors, cases, customers (debtors), payments and payouts, vouchers, files, updates, and webhook subscriptions.
  version: '1.0'
  contact:
    name: Debbie API Support
    email: api-support@debbie.dk
servers:
- url: https://api.debbie.dk
  description: Production
security:
- bearerAuth: []
tags:
- name: Creditors
paths:
  /creditors:
    post:
      summary: Create a creditor
      operationId: createCreditor
      tags:
      - Creditors
      responses:
        '201':
          description: Creditor created.
  /creditors/{creditorId}:
    get:
      summary: Get a creditor
      operationId: getCreditor
      tags:
      - Creditors
      parameters:
      - in: path
        name: creditorId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A creditor resource.
    patch:
      summary: Update a creditor
      operationId: patchCreditor
      tags:
      - Creditors
      parameters:
      - in: path
        name: creditorId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Updated creditor.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
