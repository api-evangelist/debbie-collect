openapi: 3.2.0
info:
  title: Debbie Platform Case Vouchers API
  description: The Debbie Platform API is a RESTful interface for debt-collection operations on the Debbie SaaS platform. It exposes resources for creditors, cases, customers (debtors), payments and payouts, vouchers, files, updates, and webhook subscriptions.
  version: '1.0'
  contact:
    name: Debbie API Support
    email: api-support@debbie.dk
servers:
- url: https://api.debbie.dk
  description: Production
security:
- bearerAuth: []
tags:
- name: Case Vouchers
paths:
  /cases/{caseId}/vouchers:
    get:
      summary: Get case vouchers
      operationId: getCaseVouchers
      tags:
      - Case Vouchers
      parameters:
      - in: path
        name: caseId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Vouchers attached to a case.
    post:
      summary: Add case voucher
      operationId: addCaseVoucher
      tags:
      - Case Vouchers
      parameters:
      - in: path
        name: caseId
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Voucher added.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
