openapi: 3.2.0
info:
  title: Debbie Platform Billing API
  description: The Debbie Platform API is a RESTful interface for debt-collection operations on the Debbie SaaS platform. It exposes resources for creditors, cases, customers (debtors), payments and payouts, vouchers, files, updates, and webhook subscriptions.
  version: '1.0'
  contact:
    name: Debbie API Support
    email: api-support@debbie.dk
servers:
- url: https://api.debbie.dk
  description: Production
security:
- bearerAuth: []
tags:
- name: Billing
paths:
  /billing/deposit-distribution:
    get:
      summary: Get deposit distribution
      operationId: getDepositDistribution
      tags:
      - Billing
      responses:
        '200':
          description: Deposit distribution detail.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
