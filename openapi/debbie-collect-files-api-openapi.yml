openapi: 3.2.0
info:
  title: Debbie Platform Files API
  description: The Debbie Platform API is a RESTful interface for debt-collection operations on the Debbie SaaS platform. It exposes resources for creditors, cases, customers (debtors), payments and payouts, vouchers, files, updates, and webhook subscriptions.
  version: '1.0'
  contact:
    name: Debbie API Support
    email: api-support@debbie.dk
servers:
- url: https://api.debbie.dk
  description: Production
security:
- bearerAuth: []
tags:
- name: Files
paths:
  /files:
    post:
      summary: Upload a file
      operationId: createFile
      tags:
      - Files
      responses:
        '201':
          description: File created.
  /files/{fileId}:
    get:
      summary: Get a file
      operationId: getFile
      tags:
      - Files
      parameters:
      - in: path
        name: fileId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A file resource.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
