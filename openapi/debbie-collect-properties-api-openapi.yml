openapi: 3.2.0
info:
  title: Debbie Platform Properties API
  description: The Debbie Platform API is a RESTful interface for debt-collection operations on the Debbie SaaS platform. It exposes resources for creditors, cases, customers (debtors), payments and payouts, vouchers, files, updates, and webhook subscriptions.
  version: '1.0'
  contact:
    name: Debbie API Support
    email: api-support@debbie.dk
servers:
- url: https://api.debbie.dk
  description: Production
security:
- bearerAuth: []
tags:
- name: Properties
paths:
  /properties:
    get:
      summary: Get properties by reference
      operationId: getProperties
      tags:
      - Properties
      responses:
        '200':
          description: Properties for a referenced resource.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
