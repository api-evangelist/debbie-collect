openapi: 3.1.0
info:
  title: Debbie Client Billing Properties API
  description: The Debbie Client API is intended for creditors integrating directly with Debbie. It allows clients to create and update collection cases, exchange payment data, and receive case status updates.
  version: '1.0'
  contact:
    name: Debbie API Support
    email: api-support@debbie.dk
servers:
- url: https://creditor.debbie.dk/api
  description: Production
security:
- bearerAuth: []
tags:
- name: Properties
paths:
  /properties:
    get:
      summary: Get properties by reference
      operationId: getProperties
      tags:
      - Properties
      responses:
        '200':
          description: Properties for a referenced resource.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
